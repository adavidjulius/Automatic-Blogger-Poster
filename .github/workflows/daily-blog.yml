name: ReadContent Blogger Auto Post

on:
  schedule:
    - cron: '30 3 * * *'   # 03:30 UTC (09:00 IST)
    - cron: '0 7 * * *'    # 07:00 UTC (12:30 IST)
    - cron: '30 12 * * *'  # 12:30 UTC (18:00 IST)
    - cron: '0 13 * * *'   # 13:00 UTC (18:30 IST)
    - cron: '30 16 * * *'  # 16:30 UTC (22:00 IST)
    - cron: '0 19 * * *'   # 19:00 UTC (00:30 IST)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-and-post:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate and post to Blogger
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          GOOGLE_CSE_API_KEY: ${{ secrets.GOOGLE_CSE_API_KEY }}
          GOOGLE_CSE_ID: ${{ secrets.GOOGLE_CSE_ID }}
        run: |
          mkdir -p .blog-cache _posts
          python scripts/generate_post.py

      - name: Commit and push changes
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _posts/ .blog-cache/ index.md
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-published post: $(date -u +'%Y-%m-%d %H:%M:%S UTC') [skip ci]"
            git push
          fi

      - name: Upload post artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blog-post-${{ github.run_id }}
          path: _posts/*.md
